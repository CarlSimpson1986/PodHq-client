workflows:
  ios-testflight:
    name: iOS TestFlight build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: myfitpod_app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.myfitpod.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "uk.co.myfitpod.app"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing (App Store Connect integration)
        script: xcode-project use-profiles
      - name: Set build number from Codemagic build counter
        script: |
          cd ios/App
          agvtool new-version -all $CM_BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
